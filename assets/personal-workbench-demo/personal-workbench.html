function render(){nav();if(page&&page.kind==='project')return projectView(page.id);if(page&&page.kind==='task')return taskView(page.pid,page.id);if(page&&page.kind==='plan')return planView(page.id);if(page&&page.kind==='day')return dayView(page.date);if(page&&page.kind==='note')return noteView(page.id);if(tab==='home')home();if(tab==='work')work();if(tab==='life')life();if(tab==='journal')journal()}
function home(){const s=stat();view.innerHTML='<p class="eyebrow">9 月 4 日 · 星期五</p><h1 class="hero">下午好，林然。</h1><p class="lead">今天有 2 项工作、1 项生活计划值得推进。</p><section class="metrics"><div class="metric"><span>正在进行的项目</span><b>'+s.active+' <em>个</em></b></div><div class="metric"><span>已完成的任务</span><b>'+s.tasks+' <em>项</em></b></div><div class="metric"><span>待完成生活计划</span><b>'+s.plans+' <em>项</em></b></div></section><section><div class="section-head"><h2>正在聚焦</h2><button class="text-btn" data-tabgo="work">查看项目</button></div><button class="focus" data-open-project="p1"><small>工作项目 · 进行中 · 高优先级</small><h2>2026 城市跑报名计划</h2><p>完成报名资料审核、分组通知和参赛提醒。</p><div class="focus-foot"><span>1 / 2 个任务完成</span><span class="track"><i></i></span></div></button></section><section><div class="section-head"><h2>今天的日程</h2><button class="text-btn" data-tabgo="life">查看计划</button></div><div class="agenda"><button class="agenda-item" data-open-task="p1:t1"><span class="time">09:00<br>— 14:00</span><span><b>审核 12 条报名资料</b><p>工作 · 城市跑报名计划</p></span><span class="chip work">工作</span></button><button class="agenda-item" data-open-plan="l1"><span class="time">18:30<br>— 20:00</span><span><b>完成课程章节阅读</b><p>生活 · 学习计划</p></span><span class="chip life">生活</span></button><button class="agenda-item" data-open-task="p2:t3"><span class="time">20:30<br>— 21:30</span><span><b>确认三篇文章选题</b><p>工作 · 秋季内容专题</p></span><span class="chip work">工作</span></button></div></section>'}
function work(){view.innerHTML='<div class="title-row"><div><h1>工作</h1><p>项目是目标，任务是可完成的下一步。</p></div><button class="add" data-action="add-project">+ 项目</button></div><div class="list">'+data.projects.map(p=>'<button class="project" data-open-project="'+p.id+'"><i class="dot"></i><span><b>'+esc(p.name)+'</b><p>'+esc(p.summary)+'</p><span class="meta">'+dateText(p.start)+' — '+dateText(p.end)+' · '+esc(p.priority)+'优先级 · '+esc(p.status)+'</span></span><i class="arrow">›</i></button>').join('')+'</div>'}
function projectView(id){const p=data.projects.find(x=>x.id===id);if(!p){page=null;return work()}view.innerHTML='<header class="detail-head"><button class="back" data-back="work">‹</button><span>工作项目</span></header><h1 class="detail-title">'+esc(p.name)+'</h1><p class="detail-summary">'+esc(p.summary)+'</p><p class="detail-content">'+esc(p.content)+'</p><section class="facts"><span>状态<b>'+esc(p.status)+'</b></span><span>优先级<b>'+esc(p.priority)+'</b></span><span>开始时间<b>'+dateText(p.start)+'</b></span><span>结束时间<b>'+dateText(p.end)+'</b></span></section><div class="actions"><button data-action="edit-project" data-id="'+p.id+'">编辑项目</button><button class="danger" data-action="delete-project" data-id="'+p.id+'">删除项目</button></div><div class="section-head"><h2>任务列表 · '+p.tasks.length+' 项</h2><button class="add" data-action="add-task" data-pid="'+p.id+'">+ 任务</button></div><div class="list">'+p.tasks.map(t=>'<article class="task '+(t.status==='已完成'?'done':'')+'"><i class="check"></i><button data-open-task="'+p.id+':'+t.id+'"><h3>'+esc(t.name)+'</h3><p>'+esc(t.summary)+'</p><small>'+dateText(t.start)+' — '+dateText(t.end)+' · '+esc(t.priority)+'优先级</small></button>'+statusChip(t.status)+'</article>').join('')+'</div>'}
function taskView(pid,id){const p=data.projects.find(x=>x.id===pid),t=p&&p.tasks.find(x=>x.id===id);if(!t){page={kind:'project',id:pid};return projectView(pid)}view.innerHTML='<header class="detail-head"><button class="back" data-open-project="'+pid+'">‹</button><span>任务 · '+esc(p.name)+'</span></header><h1 class="detail-title">'+esc(t.name)+'</h1><p class="detail-summary">'+esc(t.summary)+'</p><p class="detail-content">'+esc(t.content)+'</p><section class="facts"><span>状态<b>'+esc(t.status)+'</b></span><span>优先级<b>'+esc(t.priority)+'</b></span><span>开始时间<b>'+dateText(t.start)+'</b></span><span>结束时间<b>'+dateText(t.end)+'</b></span></section><div class="actions"><button data-action="edit-task" data-pid="'+pid+'" data-id="'+id+'">编辑任务</button><button class="danger" data-action="delete-task" data-pid="'+pid+'" data-id="'+id+'">删除任务</button></div>'}
function life(){view.innerHTML='<div class="title-row"><div><h1>生活</h1><p>个人计划和工作项目一样值得被认真安排。</p></div><button class="add" data-action="add-plan">+ 计划</button></div><section class="life-banner"><small>本周主题 · 重新找回学习节奏</small><h2>慢一点，也在前进。</h2><p>学习、健康和关系各有位置，不会被工作日程吞没。</p></section><section><div class="section-head"><h2>个人计划 · '+data.plans.length+' 项</h2><span class="chip life">可编辑</span></div><div class="list">'+data.plans.map(p=>'<article class="plan '+(p.status==='已完成'?'done':'')+'"><i class="check"></i><button data-open-plan="'+p.id+'"><h3>'+esc(p.name)+'</h3><p>'+esc(p.summary)+'</p><small>'+esc(p.category)+' · '+dateText(p.start)+' — '+dateText(p.end)+' · '+esc(p.priority)+'优先级</small></button>'+statusChip(p.status)+'</article>').join('')+'</div></section>'}
function planView(id){const p=data.plans.find(x=>x.id===id);if(!p){page=null;return life()}view.innerHTML='<header class="detail-head"><button class="back" data-back="life">‹</button><span>个人计划</span></header><h1 class="detail-title">'+esc(p.name)+'</h1><p class="detail-summary">'+esc(p.summary)+'</p><p class="detail-content">'+esc(p.content)+'</p><section class="facts"><span>分类<b>'+esc(p.category)+'</b></span><span>状态<b>'+esc(p.status)+'</b></span><span>优先级<b>'+esc(p.priority)+'</b></span><span>时间范围<b>'+dateText(p.start)+' — '+dateText(p.end)+'</b></span></section><div class="actions"><button data-action="edit-plan" data-id="'+p.id+'">编辑计划</button><button class="danger" data-action="delete-plan" data-id="'+p.id+'">删除计划</button></div>'}
function journal(){const monthStart=2,days=30;let cells='';for(let i=0;i<monthStart;i++)cells+='<span class="day blank"></span>';for(let d=1;d<=days;d++){const n=data.notes.find(x=>x.date===d);cells+='<button class="day '+(n?'has-note ':'')+(selectedDate===d?'selected':'')+'" data-open-day="'+d+'">'+(n?'<img src="'+A+n.image+'" alt="">':'')+'<span>'+d+'</span></button>'}view.innerHTML='<div class="month-head"><h1>随笔</h1><div class="month-nav"><button data-action="prev-month">‹</button><span>2026 年 9 月</span><button data-action="next-month">›</button></div></div><div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="calendar">'+cells+'</div><div class="journal-hint">这是完整月历。带照片的日期已有随笔；点击任意日期进入当天，查看、新增、修改或删除记录。</div><button class="add" style="width:100%" data-open-day="'+selectedDate+'">查看 '+selectedDate+' 日随笔</button>'}
function dayView(date){selectedDate=Number(date);const notes=data.notes.filter(n=>n.date===selectedDate);view.innerHTML='<header class="detail-head"><button class="back" data-back="journal">‹</button><span>2026 年 9 月</span></header><div class="title-row"><div><h1>9 月 '+selectedDate+' 日</h1><p>'+notes.length+' 则随笔 · 内容不会显示在月历页</p></div><button class="add" data-action="add-note" data-date="'+selectedDate+'">+ 随笔</button></div>'+(notes.length?notes.map(n=>'<button class="note-card" data-open-note="'+n.id+'"><img src="'+A+n.image+'" alt=""><span><time>'+n.time+' · 有图片</time><h2>'+esc(n.title)+'</h2><p>'+esc(n.content.slice(0,34))+(n.content.length>34?'…':'')+'</p><span class="meta">点击查看、修改或删除</span></span></button>').join(''):'<div class="journal-hint">这一天还没有随笔。可以拍一张照片，写一段话。</div>')}
function noteView(id){const n=data.notes.find(x=>x.id===id);if(!n){return dayView(selectedDate)}view.innerHTML='<header class="detail-head"><button class="back" data-open-day="'+n.date+'">‹</button><span>9 月 '+n.date+' 日 · 随笔</span></header><article class="note-view"><img src="'+A+n.image+'" alt=""><time>'+n.time+' · 生活片段</time><h1>'+esc(n.title)+'</h1><p>'+esc(n.content)+'</p></article><div class="actions"><button data-action="edit-note" data-id="'+n.id+'">编辑随笔</button><button class="danger" data-action="delete-note" data-id="'+n.id+'">删除随笔</button></div>'}
function input(label,name,value,type){return '<label class="field">'+label+'<input required name="'+name+'" type="'+(type||'text')+'" value="'+esc(value)+'"></label>'}
function select(label,name,value,options){return '<label class="field">'+label+'<select name="'+name+'">'+options.map(o=>'<option '+(o===value?'selected':'')+'>'+o+'</option>').join('')+'</select></label>'}
function text(label,name,value){return '<label class="field">'+label+'<textarea required name="'+name+'">'+esc(value)+'</textarea></label>'}
function openModal(kind,obj,extra){modalState={kind,obj,extra};let title='',body='';if(kind==='project'){title=obj.id?'编辑项目':'新增项目';body=input('项目名称','name',obj.name)+text('核心摘要','summary',obj.summary)+text('项目内容','content',obj.content)+select('状态','status',obj.status,['未开始','进行中','已完成','已归档'])+select('优先级','priority',obj.priority,['高','中','低'])+'<div class="twocol">'+input('开始时间','start',obj.start,'date')+input('结束时间','end',obj.end,'date')+'</div>'}if(kind==='task'){title=obj.id?'编辑任务':'新增任务';body=input('任务名称','name',obj.name)+text('任务核心摘要','summary',obj.summary)+text('任务内容','content',obj.content)+select('状态','status',obj.status,['未开始','进行中','已完成'])+select('优先级','priority',obj.priority,['高','中','低'])+'<div class="twocol">'+input('开始时间','start',obj.start,'datetime-local')+input('结束时间','end',obj.end,'datetime-local')+'</div>'}if(kind==='plan'){title=obj.id?'编辑个人计划':'新增个人计划';body=input('计划名称','name',obj.name)+text('核心摘要','summary',obj.summary)+text('计划内容','content',obj.content)+select('分类','category',obj.category,['学习','健康','关系','兴趣','家务'])+select('状态','status',obj.status,['未开始','进行中','已完成'])+select('优先级','priority',obj.priority,['高','中','低'])+'<div class="twocol">'+input('开始时间','start',obj.start,'date')+input('结束时间','end',obj.end,'date')+'</div>'}if(kind==='note'){title=obj.id?'编辑随笔':'新增随笔';body=input('标题','title',obj.title)+text('写一段话','content',obj.content)+'<label class="field">图片<input name="image" type="file" accept="image/*" capture="environment"></label>'}modal.innerHTML='<div class="modal-head"><h2>'+title+'</h2><button class="close" type="button" data-action="close-modal">×</button></div>'+body+'<button class="submit" type="submit">保存</button>';modalWrap.classList.add('show')}
function saveForm(form){const f=new FormData(form),o=modalState.obj,k=modalState.kind;['name','summary','content','status','priority','start','end','category','title'].forEach(key=>{if(f.has(key))o[key]=f.get(key)});if(k==='project'){if(!o.id){o.id=uid('p');o.tasks=[];data.projects.push(o)}page={kind:'project',id:o.id}}if(k==='task'){const p=data.projects.find(x=>x.id===modalState.extra);if(!o.id){o.id=uid('t');p.tasks.push(o)}page={kind:'project',id:p.id}}if(k==='plan'){if(!o.id){o.id=uid('l');data.plans.push(o)}page={kind:'plan',id:o.id}}if(k==='note'){const file=f.get('image');if(!o.id){o.id=uid('n');o.date=modalState.extra;o.time='现在';o.image='clouds.jpg';data.notes.push(o)}if(file&&file.name)o.image=URL.createObjectURL(file);page={kind:'day',date:o.date}}modalWrap.classList.remove('show');notify('已保存');render()}
function remove(kind,id,pid){if(!confirm('确定删除这条假数据吗？'))return;if(kind==='project'){data.projects=data.projects.filter(x=>x.id!==id);page=null;tab='work'}if(kind==='task'){const p=data.projects.find(x=>x.id===pid);p.tasks=p.tasks.filter(x=>x.id!==id);page={kind:'project',id:pid}}if(kind==='plan'){data.plans=data.plans.filter(x=>x.id!==id);page=null;tab='life'}if(kind==='note'){const n=data.notes.find(x=>x.id===id);data.notes=data.notes.filter(x=>x.id!==id);page={kind:'day',date:n.date}}notify('已删除');render()}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;page=null;render()});
view.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tabgo){tab=b.dataset.tabgo;page=null;render()}if(b.dataset.openProject){page={kind:'project',id:b.dataset.openProject};render()}if(b.dataset.openTask){const a=b.dataset.openTask.split(':');page={kind:'task',pid:a[0],id:a[1]};render()}if(b.dataset.openPlan){page={kind:'plan',id:b.dataset.openPlan};render()}if(b.dataset.openDay){page={kind:'day',date:b.dataset.openDay};render()}if(b.dataset.openNote){page={kind:'note',id:b.dataset.openNote};render()}if(b.dataset.back){tab=b.dataset.back;page=null;render()}const a=b.dataset.action;if(a==='add-project')openModal('project',{name:'',summary:'',content:'',status:'未开始',priority:'中',start:'2026-09-04',end:'2026-09-30'});if(a==='edit-project')openModal('project',data.projects.find(x=>x.id===b.dataset.id));if(a==='delete-project')remove('project',b.dataset.id);if(a==='add-task')openModal('task',{name:'',summary:'',content:'',status:'未开始',priority:'中',start:'2026-09-04T09:00',end:'2026-09-04T10:00'},b.dataset.pid);if(a==='edit-task'){const p=page&&data.projects.find(x=>x.id===page.pid);openModal('task',p.tasks.find(x=>x.id===b.dataset.id),p.id)}if(a==='delete-task')remove('task',b.dataset.id,b.dataset.pid);if(a==='add-plan')openModal('plan',{name:'',summary:'',content:'',category:'学习',status:'未开始',priority:'中',start:'2026-09-04',end:'2026-09-10'});if(a==='edit-plan')openModal('plan',data.plans.find(x=>x.id===b.dataset.id));if(a==='delete-plan')remove('plan',b.dataset.id);if(a==='add-note')openModal('note',{title:'',content:''},Number(b.dataset.date));if(a==='edit-note')openModal('note',data.notes.find(x=>x.id===b.dataset.id));if(a==='delete-note')remove('note',b.dataset.id);if(a==='close-modal')modalWrap.classList.remove('show');if(a==='menu'||a==='prev-month'||a==='next-month')notify('这是完整假数据样机，当前月份固定为 2026 年 9 月')});
modalWrap.addEventListener('click',e=>{if(e.target===modalWrap)modalWrap.classList.remove('show')});modal.addEventListener('submit',e=>{e.preventDefault();saveForm(e.currentTarget)});document.querySelector('.bar').addEventListener('click',e=>{if(e.target.closest('[data-action="menu"]'))notify('当前样机数据只保存在浏览器内，刷新后恢复初始状态')});modal.addEventListener('click',e=>{if(e.target.closest('[data-action="close-modal"]'))modalWrap.classList.remove('show')});render();
</script></body></html>
